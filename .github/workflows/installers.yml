name: Build Installers

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or commit to build (blank for the branch this runs on)'
        required: false
        default: ''
  # TEMPORARY: lets the workflow run in a fork during development, remove before merging
  push:
    branches: [ installer-build-sign-15958 ]

permissions:
  contents: read

jobs:
  linux-windows:
    name: Linux and Windows installers
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ inputs.ref }}
        persist-credentials: false
    - name: Set up JDK 11
      uses: actions/setup-java@v6
      with:
        distribution: 'zulu'
        java-version: 11
    - name: Install Ant and NSIS
      run: sudo apt-get update -q && sudo apt-get install -y -q ant nsis
    - name: Build Linux installer
      run: ant package-linux
    - name: Build Windows installer
      run: ant package-windows
    # the Mac folder is built here too, since macOS runners are scarce; a tar keeps the launchers executable
    - name: Build macOS folder
      run: |
        ant dist-macosx
        version=$(basename dist/release/JMRI.*.tgz .tgz)
        version=${version#JMRI.}
        tar -C dist/MacOSX -cf "dist/release/JMRI.$version+macos.tar" JMRI
    - uses: actions/upload-artifact@v7
      with:
        name: installers-linux-windows
        path: |
          dist/release/*.tgz
          dist/release/*.exe
        compression-level: 0
        if-no-files-found: error
    - uses: actions/upload-artifact@v7
      with:
        name: macos-unsigned
        path: dist/release/*+macos.tar
        retention-days: 1
        if-no-files-found: error

  # this job never runs code from the branch being built, since it holds the signing secrets
  macos-sign:
    name: macOS installer
    needs: linux-windows
    runs-on: macos-latest
    timeout-minutes: 120
    # secrets live in this environment; restrict it to protected branches
    environment: installer-signing
    # only one signing run at a time; never cancel one, since that wastes a notarization
    concurrency:
      group: macos-signing
      cancel-in-progress: false
    env:
      HAS_SIGNING_CERT: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 != '' }}
      HAS_NOTARY_KEY: ${{ secrets.APPLE_API_KEY_P8 != '' && vars.APPLE_API_KEY_ID != '' && vars.APPLE_API_ISSUER_ID != '' }}
    steps:
    - name: Check signing setup
      if: github.repository == 'JMRI/JMRI'
      run: |
        if [ "$HAS_SIGNING_CERT" != true ] || [ "$HAS_NOTARY_KEY" != true ]; then
          echo "::error::Signing secrets or variables are missing from the installer-signing environment"
          exit 1
        fi
    - name: Check out signing scripts
      uses: actions/checkout@v7
      with:
        persist-credentials: false
        sparse-checkout: |
          scripts/macos-sign-dmg.sh
          scripts/macos-verify-dmg.sh
        sparse-checkout-cone-mode: false
    - uses: actions/download-artifact@v8
      with:
        name: macos-unsigned
        path: ${{ runner.temp }}/macos-unsigned

    - name: Set up signing keychain
      if: env.HAS_SIGNING_CERT == 'true'
      env:
        MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
        MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      run: |
        keychain="$RUNNER_TEMP/signing.keychain-db"
        keychain_password=$(uuidgen)
        echo "::add-mask::$keychain_password"
        (umask 077 && printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12")
        security create-keychain -p "$keychain_password" "$keychain"
        security set-keychain-settings -lut 21600 "$keychain"
        security unlock-keychain -p "$keychain_password" "$keychain"
        security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
        rm -f "$RUNNER_TEMP/cert.p12"
        for ca in DeveloperIDG2CA DeveloperIDCA; do
          curl -fsSL -o "$RUNNER_TEMP/$ca.cer" "https://www.apple.com/certificateauthority/$ca.cer"
          security import "$RUNNER_TEMP/$ca.cer" -k "$keychain" || echo "$ca not imported (may already be present)"
        done
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
        security list-keychains -d user -s "$keychain" login.keychain-db
        identity=$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)
        if [ -z "$identity" ]; then
          echo "::error::No Developer ID Application identity in the certificate"
          exit 1
        fi
        echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
        echo "SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"

    - name: Set up notary key
      if: env.HAS_SIGNING_CERT == 'true' && env.HAS_NOTARY_KEY == 'true'
      env:
        APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
        APPLE_API_ISSUER_ID: ${{ vars.APPLE_API_ISSUER_ID }}
      run: |
        (umask 077 && printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/notary.p8")
        {
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8"
          echo "NOTARY_KEY_ID=$APPLE_API_KEY_ID"
          echo "NOTARY_ISSUER=$APPLE_API_ISSUER_ID"
        } >> "$GITHUB_ENV"

    - name: Sign disk image
      run: |
        tarfile=$(ls "$RUNNER_TEMP"/macos-unsigned/*+macos.tar)
        version=$(basename "$tarfile" +macos.tar)
        version=${version#JMRI.}
        folder="$RUNNER_TEMP/macos-folder"
        mkdir "$folder"
        tar -C "$folder" -xf "$tarfile"
        mkdir -p dist/release
        if [ -n "${SIGNING_IDENTITY:-}" ]; then
          output="dist/release/JMRI.$version.dmg"
          scripts/macos-sign-dmg.sh "$folder" "$output" "$SIGNING_IDENTITY" "$SIGNING_KEYCHAIN"
        else
          echo "::notice::No signing certificate available, so the disk image gets an ad-hoc signature and isn't notarized"
          output="dist/release/JMRI.$version+unsigned.dmg"
          scripts/macos-sign-dmg.sh "$folder" "$RUNNER_TEMP/JMRI.$version.dmg" -
          mv "$RUNNER_TEMP/JMRI.$version.dmg" "$output"
        fi
        echo "SIGNED_DMG=$output" >> "$GITHUB_ENV"
    - name: Verify signatures
      run: |
        if [ -n "${NOTARY_KEY_PATH:-}" ]; then
          scripts/macos-verify-dmg.sh "$SIGNED_DMG" notarized
        else
          scripts/macos-verify-dmg.sh "$SIGNED_DMG"
        fi
    - uses: actions/upload-artifact@v7
      with:
        name: installer-macos
        path: dist/release/*.dmg
        compression-level: 0
        if-no-files-found: error

    - name: Clean up signing keychain
      if: always()
      run: |
        if [ -n "${SIGNING_KEYCHAIN:-}" ]; then
          security delete-keychain "$SIGNING_KEYCHAIN" || true
        fi
        rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/cert.p12"
