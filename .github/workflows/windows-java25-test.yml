# This workflow will build a Java project with Maven
# For more information see: https://docs.github.com/en/actions/tutorials/build-and-test-code/java-with-maven

name: Windows Java25 CI Tests

on: [ push, pull_request ]
#  push:
#    branches: [ master ]
#  pull_request:
#    branches: [ master ]

# One run per pull request: a new push to a PR cancels that PR's older run, so a superseded run
# doesn't hold a runner. Push runs, including every master commit, are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        distribution: 'zulu'
        java-version: 25
        # problem-matcher=false disable annotations viewing PRs
        problem-matcher: false
    - name: Change screen resolution
      run: Set-DisplayResolution -Width 1600 -Height 1200 -Force
      shell: pwsh
    - name: Cache Maven packages
      uses: actions/cache@v6
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
    - name: Test with Maven
      run: |
        # run all tests using maven
        mvn test "-Djmri.skipTestsRequiringSeparateRunning=true" "-Dsurefire.printSummary=true"
    - name: Upload generated screenshots artifact
      uses: actions/upload-artifact@v4
      if: ${{ always() }}
      with:
        name: screenshots
        path: temp/temp/*
