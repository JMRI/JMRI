# This workflow will build a Java project with Maven-Ant then run LinkedWarrantTest
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Run LinkedWarrantTest

on: [ push, pull_request ]
#  push:
#    branches: [ master ]
#  pull_request:
#    branches: [ master ]

# One run per pull request: a new push to a PR cancels that PR's older run, so a superseded run
# doesn't hold a runner. Push runs, including every master commit, are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:

    # Linux: GitHub's macOS (Apple-silicon) runners are often short of capacity, and jobs then fail without
    # running. None of these tests is macOS-specific; the GUI tests get a virtual screen from xvfb-run below.
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 11
      uses: actions/setup-java@v6
      with:
        distribution: 'zulu'
        java-version: 11
        # problem-matcher=false disable annotations viewing PRs
        problem-matcher: false
    - name: Cache Maven packages
      uses: actions/cache@v6
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
    - name: Build and Run
      run: |
        # compile code and tests
        mvn antrun:run -Danttarget=tests
        # run individual tests on a virtual screen; without one, the GUI tests skip themselves and still pass
        xvfb-run -a -s "-screen 0 1600x1200x24" ./scripts/run_linked_warrant_test jmri/jmrit/logix/LinkedWarrantTest.java
