# Strings for simulated trains

PlacementNotSimulated = Simulated trains can only be placed when every connection in the profile is a simulator.
EndOfTrackName = the end of the track
NoPlace = There is no place where "{0}" is entered from {1}.
MoreThanOnePlace = "{0}" is entered from {1} in more than one place; choose a Block that joins it in one place.
EndOfTrack = The track ends at the far end of "{0}".
PointsAgainstEntering = The turnouts in "{0}" are set against a train from "{1}".
PointsAgainstLeaving = The turnouts in "{0}" are not set for any way out.
MoreThanOneWay = The turnouts in "{0}" are set for more than one way out.
NoPathThrough = "{0}" has no path from where the train enters it.
TurnoutNotSet = Turnout "{0}" is not known to be closed or thrown.
PointsAgainst = Turnout "{0}" is set against the train.
PointsMovedUnderTrain = Turnout "{0}" was moved under the train.
TrackWithoutBlock = Track "{0}" has no Block.
TrackLoops = The track in "{0}" loops back on itself without leaving the Block.
TrackNotSupported = Simulated trains can not yet run through "{0}" (turntables and traversers are not followed).
TrainNeedsLoco = Train "{0}" needs at least one loco.
TrainNeedsLength = Train "{0}" needs a length of more than 0.
TrainNeedsLocoLength = Train "{0}" is detected by its loco, so its loco needs a length.
WayChangedUnderTrain = The way through "{0}" changed under the train.
TrainNotPlaced = Train "{0}" is not placed.
TrainAlreadyPlaced = Train "{0}" is already placed.
FrontOutsideBlock = The front of the train must be between 0 and {1} mm into "{0}".
TrainDoesNotFit = Train "{0}" does not fit there: {1}
PlacedOnTrain = Train "{0}" would be on train "{1}" in "{2}".
TailMarkerLength = The tail marker's length must be more than 0.
MarkerNeeded = At least one detection marker is needed.
MarkerValues = A detection marker's offset must be 0 or more and its length more than 0.
CvOutOfRange = CV value {0} is outside 0 to 255.
SpeedFactorTooLow = A train can't run 100% or more slower than its profile.
FaultBeforePlacing = This fault can only be set before any train is placed.
FaultNeedsTrain = A train must be placed before a Block can show a train that isn't there.
Stalled = The train has stalled.
StalledAt = The train has stalled in "{0}".
BreakawayOutsideTrain = A train can only part at a point more than 0 and less than {0} mm from its front.
BreakawayRearName = {0} (rear)
