# Bundle.properties
#
# Default properties for the jmri.jmrit.trainrecord package

CheckTrainNoLength = Train "{0}" has no length from any source, so how many Blocks it takes up isn''t known. If \
  Dispatcher runs it, enter its Max Train Length.
CheckTrainNoRosterEntry = Train "{0}" has no loco with a roster entry, so its speed can''t be followed and where it is \
  between detectors can''t be estimated.
CheckTrainNoSpeedProfile = Train "{0}" has no speed profile in its lead loco''s roster entry "{1}", so where it is \
  between detectors can''t be estimated. Measure one with the speed profiling tool.
CheckBlockNoLength = Block "{0}" has no length, so a train''s position in it can''t be worked out.
CheckDarkBlockNoLength = Block "{0}" has no detector and no length: everything known about a train in it depends on its \
  length.
CheckBlockNoPaths = Block "{0}" has a detector but no paths to other Blocks, so a train can''t be followed into or out of \
  it.
CheckPathOneWay = Block "{0}" has a path to Block "{1}", but "{1}" has none back to "{0}".
CheckSensorShared = Sensor "{0}" is the detector of more than one Block: {1}.
CheckDarkBlockTurnout = Block "{0}" has no detector, and its routes depend on turnout "{1}", which has no feedback: the way a \
  train takes through it is only what was commanded.
CheckDarkRunSeveralWays = Blocks "{0}" and "{1}" are joined through Blocks with no detector by more than one way, and no \
  turnout chooses between them, so which way a train went can''t be told.

# Reasons: why something about a train changed. {0} Block, {1} other Block, {2} time, {3} sensor, {4} Blocks passed through
ReasonPLACED = Placed in {0} at {2}.
ReasonPLACED_BY_VALUE = Placed in {0} at {2}: the Block''s value names this train.
ReasonPLACED_BY_DISPATCHER = Placed in {0} at {2}: Dispatcher started this train there.
ReasonUNPLACED = Taken off the layout at {2}.
ReasonENTERED = Entered {0} from {1} at {2}: sensor {3} went Active.
ReasonENTERED_THROUGH_DARK = Entered {0} at {2}, through {4}, which have no detector: sensor {3} went Active and no \
  other train could have reached it.
ReasonAMBIGUOUS = More than one train could have entered {0} at {2}, when sensor {3} went Active: which one isn''t known \
  until the Block''s value names it.
ReasonENTERED_END_UNKNOWN = Entered {0} at {2}, when sensor {3} went Active: {0} is next to both ends of the train, and \
  which end entered isn''t known until the train leaves one of them.
ReasonSETTLED_BY_VALUE = Entered {0} from {1} at {2}: of the trains that could have, the Block''s value names this one.
ReasonAMBIGUITY_CLEARED = No longer one of the trains that could have entered {0} ({2}).
ReasonLEFT = Left {0} at {2}: sensor {3} went Inactive.
ReasonLEFT_DARK_BEHIND = Left {0} at {2}: it has no detector, and the train was seen to leave the Block in front of it.
ReasonKEPT_AFTER_DROPOUT = {0} went empty at {2} (sensor {3}), but the train can''t have left it from there: kept in {0}, \
  position estimated.
ReasonNOT_SEEN = Not seen at {2}: none of its Blocks with a detector shows it, since {0} went empty.
ReasonSEEN_AGAIN = Seen again in {0} at {2}: sensor {3} went Active.
ReasonNoSensor = (none)
ReasonNoBlock = (none)

# Confidence, as shown
ConfidenceCONFIRMED = Confirmed
ConfidenceESTIMATED = Position estimated
ConfidenceAMBIGUOUS = Ambiguous
ConfidenceSTALLED = Stalled
ConfidenceLOST = Lost
# Shown after a train''s name on a panel and in the Block Table when the operator needs to check it; {0} train name
TrainNameAMBIGUOUS = {0} (?)
TrainNameSTALLED = {0} (stalled)
TrainNameLOST = {0} (lost)
