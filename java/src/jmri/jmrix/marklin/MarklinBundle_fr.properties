# French properties for the jmri.jmrix.marklin package

# Turnout table entry
TurnoutEntryToolTip = MM&lt;n&gt; - adresse accessoire Märklin/Motorola (ex. : MM12)<br>\
  DCC&lt;n&gt; - adresse accessoire DCC (ex. : DCC45)<br>\
  CAN&lt;n&gt; - adresse brute sur bus CAN, ex. pour la plage constructeur CdB (ex. : CAN7168)<br>\
  &lt;n&gt; - numéro simple, traité comme DCC (hérité)

# Light table entry
